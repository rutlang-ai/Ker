name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Linux core (DPDK off)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build python3

      - name: Check out pinned Linux source
        run: git submodule update --init --depth 1 third_party/linux

      - name: Verify pinned Linux gitlink
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-tree HEAD third_party/linux | awk '{print $3}')"
          actual="$(git -C third_party/linux rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          printf 'Pinned Linux gitlink: %s\n' "$actual"

      - name: Configure core suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DKER_BUILD_EXAMPLES=ON \
            -DKER_WITH_DPDK=OFF \
            -DKER_WITH_NATIVE_TCP=OFF \
            -DCMAKE_C_FLAGS='-Wall -Wextra -Werror' \
            2>&1 | tee "$RUNNER_TEMP/core-configure.log"

      - name: Build core suite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-core --parallel 2 2>&1 | tee "$RUNNER_TEMP/core-build.log"

      - name: Run full core suite
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-core --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/core-ctest.xml" 2>&1 | tee "$RUNNER_TEMP/core-ctest.log"

      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr573-linux-core-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/core-configure.log
            ${{ runner.temp }}/core-build.log
            ${{ runner.temp }}/core-ctest.log
            ${{ runner.temp }}/core-ctest.xml
            build-core/Testing/Temporary/LastTest.log

  dpdk-eal:
    name: Pinned DPDK EAL (full suite and rollback accounting)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Install pinned DPDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake libbsd-dev libnuma-dev meson ninja-build pkg-config \
            python3 python3-pyelftools

      - name: Check out pinned Linux and DPDK sources
        run: git submodule update --init --depth 1 third_party/linux third_party/dpdk

      - name: Verify pinned Linux and DPDK gitlinks
        shell: bash
        run: |
          set -euo pipefail
          for path in third_party/linux third_party/dpdk; do
            expected="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            actual="$(git -C "$path" rev-parse HEAD)"
            test -n "$expected"
            test "$actual" = "$expected"
            printf 'Pinned gitlink %s: %s\n' "$path" "$actual"
          done

      - name: Build pinned DPDK
        shell: bash
        env:
          KER_DPDK_BUILD_DIR: ${{ runner.temp }}/pr573-dpdk-build
          KER_DPDK_PREFIX: ${{ runner.temp }}/pr573-dpdk-install
          KER_DPDK_JOBS: '2'
        run: |
          set -euo pipefail
          tools/build-dpdk.sh 2>&1 | tee "$RUNNER_TEMP/dpdk-build.log"

      - name: Export pinned DPDK libraries
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/pr573-dpdk-install"
          libdir="$(find "$prefix" -type f -name 'librte_eal.so.*' -print -quit | xargs -r dirname)"
          pmd_dir="$(find "$prefix" -type d -name 'pmds-*' -print -quit)"
          test -n "$libdir"
          test -n "$pmd_dir"
          runtime_path="$libdir:$pmd_dir"
          if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then
            runtime_path="$runtime_path:$LD_LIBRARY_PATH"
          fi
          echo "LD_LIBRARY_PATH=$runtime_path" >> "$GITHUB_ENV"
          printf 'Pinned DPDK runtime path: %s\n' "$runtime_path"

      - name: Configure DPDK-enabled Ker tests
        shell: bash
        run: |
          set -euo pipefail
          pkgconfig_dir="$(find "$RUNNER_TEMP/pr573-dpdk-install" -type f -name libdpdk.pc -print -quit | xargs -r dirname)"
          test -n "$pkgconfig_dir"
          PKG_CONFIG_PATH="$pkgconfig_dir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            cmake -S . -B build-dpdk -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_TESTING=ON \
              -DKER_BUILD_EXAMPLES=ON \
              -DKER_WITH_DPDK=ON \
              -DKER_WITH_NATIVE_TCP=OFF \
              -DKER_DPDK_PKGCONFIG_DIR="$pkgconfig_dir" \
              2>&1 | tee "$RUNNER_TEMP/dpdk-configure.log"

      - name: Build DPDK-enabled Ker tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-dpdk --parallel 2 2>&1 | tee "$RUNNER_TEMP/dpdk-ker-build.log"

      - name: Verify rollback tests are registered exactly once
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-dpdk -N 2>&1 | tee "$RUNNER_TEMP/dpdk-ctest-list.log"
          python3 - "$RUNNER_TEMP/dpdk-ctest-list.log" <<'PY'
          import collections
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text()
          names = re.findall(r'^\s*Test\s+#\d+:\s+(\S+)\s*$', text, re.M)
          expected = {
              f'fstack-{family}-rollback-{mode}'
              for family in ('chain', 'tx')
              for mode in ('copy', 'checksum', 'exact')
          }
          counts = collections.Counter(names)
          missing = sorted(name for name in expected if counts[name] != 1)
          if missing:
              raise SystemExit('rollback tests missing or duplicated in CTest registry: ' + ', '.join(missing))
          print(f'Rollback registry: {len(expected)} exact EAL tests, each registered once; {len(names)} total tests')
          PY

      - name: Run full DPDK-enabled suite and verify rollback results
        shell: bash
        run: |
          set -uo pipefail
          ctest --test-dir build-dpdk --no-tests=error --output-on-failure --parallel 2 \
            --output-junit "$RUNNER_TEMP/dpdk-ctest.xml" 2>&1 | tee "$RUNNER_TEMP/dpdk-ctest.log"
          ctest_status=${PIPESTATUS[0]}
          python3 - "$RUNNER_TEMP/dpdk-ctest-list.log" "$RUNNER_TEMP/dpdk-ctest.xml" <<'PY'
          import collections
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          registry_text = pathlib.Path(sys.argv[1]).read_text()
          registry_names = re.findall(r'^\s*Test\s+#\d+:\s+(\S+)\s*$', registry_text, re.M)
          registry = collections.Counter(registry_names)
          path = pathlib.Path(sys.argv[2])
          if not path.is_file():
              raise SystemExit('CTest did not write its JUnit report')
          root = ET.parse(path).getroot()
          cases = root.findall('.//testcase')
          counts = collections.Counter(case.attrib.get('name') for case in cases)
          expected = {
              f'fstack-{family}-rollback-{mode}'
              for family in ('chain', 'tx')
              for mode in ('copy', 'checksum', 'exact')
          }
          missing = sorted(name for name in expected if counts[name] != 1)
          registry_delta = sorted(
              f'{name}: CTest listed {registry[name]}, JUnit recorded {counts[name]}'
              for name in set(registry) | set(counts) if registry[name] != counts[name]
          )
          failing = sorted(
              case.attrib.get('name', '<unnamed>') for case in cases
              if case.find('failure') is not None or case.find('error') is not None or case.find('skipped') is not None
          )
          if missing or registry_delta or failing:
              if missing:
                  print('rollback JUnit entries missing or duplicated: ' + ', '.join(missing), file=sys.stderr)
              if registry_delta:
                  print('CTest registry/JUnit mismatch: ' + '; '.join(registry_delta), file=sys.stderr)
              if failing:
                  print('JUnit tests failed, errored, or skipped: ' + ', '.join(failing), file=sys.stderr)
              raise SystemExit(1)
          print(f'JUnit: all {len(cases)} registered tests passed; all six rollback tests present exactly once')
          PY
          junit_status=$?
          if (( ctest_status != 0 )); then exit "$ctest_status"; fi
          exit "$junit_status"

      - name: Upload pinned DPDK test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr573-pinned-dpdk-eal-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dpdk-build.log
            ${{ runner.temp }}/dpdk-configure.log
            ${{ runner.temp }}/dpdk-ker-build.log
            ${{ runner.temp }}/dpdk-ctest-list.log
            ${{ runner.temp }}/dpdk-ctest.log
            ${{ runner.temp }}/dpdk-ctest.xml
            build-dpdk/Testing/Temporary/LastTest.log
