; Ker launcher settings. Adjust the CPU mapping, PMD and interface for the host.
[network]
address = 198.18.0.2/24
; vip_addresses = 198.18.0.3/24, 198.18.0.4/24 ; optional additional IPv4 addresses
mtu = 1500 ; 1280..9000; configure peer links to the same MTU
; max_mtu = 9000 ; optional deployment ceiling; mtu must not exceed it
; gateway = 198.18.0.1
; address6 = 2001:db8:1::2/64 ; also enables multicast reception for NDP
; gateway6 = fe80::1 ; requires address6; global or link-local next hop
; tcp_ecn = passive ; off/passive/on; omission preserves Linux policy

[dpdk]
; base_virtaddr=0x200000000 ; EAL virtual-address hint; actual placement may differ
; file_prefix=mytest ; literal EAL runtime namespace; remove competing raw --file-prefix
; log_level=4 ; EAL startup level 1..8; logging.level applies after EAL init
port = net_tap0
eal = --lcores=0@0 --no-huge --no-pci --no-shconf --iova-mode=va --no-telemetry -m 64
    --vdev=net_tap0,iface=kerpeer,remote=kerlink
all_multicast = no
; memory = 64 ; remove raw -m 64 from eal before enabling typed memory
; no_huge = yes ; remove raw --no-huge from eal before enabling typed page policy
; pkt_tx_delay = 0 ; 0..100 microseconds; zero adds no intentional TX batch wait

[runtime]
shutdown_timeout_ms = 5000
; stats = native-stats.json

; Directories must exist. Relative paths are based on this configuration file.
; [logging]
; directory = logs
; level = 7
; [capture]
; directory = capture
; snaplen = 96
; max_bytes = 16777216
; nsec = yes
