; Ker launcher settings. Adjust the CPU mapping, PMD and interface for the host.
[network]
address = 198.18.0.2/24
mtu = 1500 ; 1280..9000; configure peer links to the same MTU
; gateway = 198.18.0.1
; tcp_ecn = passive ; off/passive/on; omission preserves Linux policy

[dpdk]
port = net_tap0
eal = --lcores=0@0 --no-huge --no-pci --no-shconf --iova-mode=va --no-telemetry -m 64
    --vdev=net_tap0,iface=kerpeer,remote=kerlink
all_multicast = no

[runtime]
shutdown_timeout_ms = 5000
; stats = native-stats.json

; Directories must exist. Relative paths are based on this configuration file.
; [logging]
; directory = logs
; level = 7
; [capture]
; directory = capture
; snaplen = 96
; max_bytes = 16777216
; nsec = yes
